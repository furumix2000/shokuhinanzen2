<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>食品安全検定2級 模擬試験（ブラウザ回答）</title>
  <style>
    :root {
      --bg:#0b0c10; --card:#11131a; --text:#e7e9ee; --muted:#a9afbf; --line:#24283a;
      --good:#7ee787; --bad:#ff7b72; --warn:#f2cc60;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:var(--bg);color:var(--text);}
    header{position:sticky;top:0;background:rgba(11,12,16,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:10}
    .wrap{max-width:1100px;margin:0 auto;padding:16px}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
    .title{font-weight:700;font-size:18px}
    .pill{display:inline-flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:rgba(17,19,26,.7)}
    .pill b{font-variant-numeric:tabular-nums}
    button, select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600;cursor:pointer}
    button:hover{border-color:#3b4261}
    button:disabled{opacity:.55;cursor:not-allowed}
    .ghost{background:transparent}
    main .wrap{padding-top:10px}
    .grid{display:grid;grid-template-columns:1fr 330px;gap:16px}
    @media (max-width: 980px){.grid{grid-template-columns:1fr}}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
    .meta{color:var(--muted);font-size:12px;line-height:1.5}
    .qhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
    .qid{font-weight:800}
    .qtitle{color:var(--muted);font-size:13px;margin-top:2px}
    .stem{margin:10px 0 12px;line-height:1.7}
    .opts{display:flex;flex-direction:column;gap:10px}
    label.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.02)}
    label.opt:hover{border-color:#3b4261}
    .opt input{margin-top:3px}
    .opt .lab{min-width:30px;font-weight:800}
    .opt .txt{line-height:1.6}
    .side h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:700}
    .stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat .box{border:1px solid var(--line);border-radius:14px;padding:10px;background:rgba(255,255,255,.02)}
    .stat .box .k{color:var(--muted);font-size:12px}
    .stat .box .v{font-variant-numeric:tabular-nums;font-weight:800;font-size:16px;margin-top:2px}
    .nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .list{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:10px;background:rgba(255,255,255,.02)}
    .qbtn{width:100%;display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;border-radius:12px}
    .tag{font-size:11px;color:var(--muted)}
    .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
    .resultline{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;color:var(--muted)}
    .small{font-size:12px;color:var(--muted);line-height:1.6}
    .kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:2px 6px;background:rgba(0,0,0,.25)}
    .exp{margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.02)}
    .toggle{display:flex;gap:10px;flex-wrap:wrap}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="row">
      <div>
        <div class="title">食品安全検定2級 模擬試験（50問 / 90分）</div>
        <div class="meta">提出後は「復習モード」で不正解のみ周回可能。即答モードは回答直後に正誤を表示します。</div>
      </div>
      <div class="row" style="gap:10px">
        <div class="pill">残り <b id="timeLeft">90:00</b></div>
        <button id="startBtn">開始</button>
        <button id="submitBtn" disabled>提出・採点</button>
        <button id="reviewBtn" class="ghost" disabled>復習モード</button>
        <button id="instantBtn" class="ghost">即答モード: OFF</button>
        <button id="resetBtn" class="ghost">リセット</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="grid">
      <section class="card" id="questionCard">
        <div class="qhead">
          <div>
            <div class="qid" id="qid">ID1</div>
            <div class="qtitle" id="qtitle">—</div>
          </div>
          <div class="meta" style="text-align:right">
            <div>進捗: <b id="progress">0/50</b></div>
            <div>現在: <b id="index">1</b> / <span id="totalCount">50</span></div>
          </div>
        </div>

        <div class="toggle small" style="margin-top:8px">
          <span>表示:</span>
          <button id="modeAllBtn" class="ghost">全問</button>
          <button id="modeWrongBtn" class="ghost" disabled>不正解のみ</button>
          <button id="modeUnansweredBtn" class="ghost" disabled>未回答のみ</button>
        </div>

        <div class="stem" id="stem"></div>
        <div id="multiNote" class="small" style="display:none;margin:8px 0 10px">
          この設問は <b>A</b> と <b>B</b> をそれぞれ選択する形式です（解答欄: A=?, B=?）。
        </div>
        <div class="opts" id="opts"></div>

        <div class="nav">
          <button id="prevBtn">← 前へ</button>
          <button id="nextBtn">次へ →</button>
          <button id="markBtn" class="ghost">見直しフラグ</button>
        </div>

        <div id="resultBox" style="display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
          <div class="resultline">
            <div>判定: <b id="judge" class="warn">—</b></div>
            <div>正解: <b id="correctAns">—</b></div>
            <div>あなた: <b id="yourAns">—</b></div>
          </div>
          <div class="exp">
            <div class="small"><b>解説（学習補助）</b></div>
            <div class="small" id="explanation"></div>
            <div class="small" style="margin-top:6px">※解説は学習用の要約です。公式解説がある場合はそちらを優先してください。</div>
          </div>
        </div>
      </section>

      <aside class="card side">
        <h3>ステータス</h3>
        <div class="stat">
          <div class="box"><div class="k">回答済み</div><div class="v" id="answered">0</div></div>
          <div class="box"><div class="k">見直し</div><div class="v" id="flagged">0</div></div>
          <div class="box"><div class="k">正解数</div><div class="v" id="score">—</div></div>
          <div class="box"><div class="k">正答率</div><div class="v" id="rate">—</div></div>
        </div>

        <h3 style="margin-top:14px">設問一覧（クリックで移動）</h3>
        <div class="list" id="qList"></div>

        <div class="small" style="margin-top:12px">
          ショートカット: <span class="kbd">←</span>/<span class="kbd">→</span>、<span class="kbd">F</span>で見直し。
        </div>
      </aside>
    </div>
  </div>
</main>

<script>
const ORIGINAL_QUESTIONS = [{"id": 1, "title": "食品安全 の基礎知識", "stem": "食品安全 の基礎知識 に関する次の説明のうち、正しいものを１つ 選べ。", "options": [{"label": "①", "text": "食の安全とは、科学的な評価によって、 食品がヒトの健康に悪影響を及ぼすリスクをゼロにする ことである。"}, {"label": "②", "text": "安心は科学的証拠 によって裏付けされたものであり、 専門家による試験や調査によって確保さ れる。"}, {"label": "③", "text": "リスクとは、ハザードが原因で食べた人の健康に悪い影響を及ぼす可能性意味 し、この可能性 には、悪影響の起こる頻度と被害の深刻さの両者が含まれる。"}, {"label": "④", "text": "ADI（一日摂取許容量） は、限界を少しでも超えると健康への悪影響が顕在化する値を定めた ものである。"}, {"label": "⑤", "text": "食品安全基本法 におけるリスク分析は、リスク評価、リスク管理、リスクコミュニケーション、リスク マネジメント、リスクアプローチ の5つの要素で構成される。"}], "answer": "3", "type": "single", "explanation": "正解（正しいもの）は ③「リスクとは、ハザードが原因で食べた人の健康に悪い影響を及ぼす可能性意味 し、この可能性 には、悪影響の起こる頻度と被害の深刻さの両者が含まれる。」。 ポイント：リスクの定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 2, "title": "食品の安全性（ハザードとリスク）", "stem": "食品の安全性（ハザードとリスク）に関する次の記述のうち、誤っているものを 1つ選 べ。", "options": [{"label": "①", "text": "ハザード（ 危害要因） には、食中毒菌等 の生物的要因、重金属 や残留農薬等 の化学的要因、 ガラス片や金属片等 の物理的要因 がある。"}, {"label": "②", "text": "リスクとは、食べた人の健康に悪い影響を及ぼす可能性をいい、悪影響が起こる頻度と被害 の深刻さの組合せである。"}, {"label": "③", "text": "食の安全とは、科学的な評価によって、 食品がヒトの健康に悪影響を及ぼすリスクをゼロにす ることである。"}, {"label": "④", "text": "食の安全のための仕組みは、リスク分析の考え方を基本としており、 リスク評価、リスク管理、リ スクコミュニケーション の3つの要素で構成される。"}, {"label": "⑤", "text": "リスクコミュニケーション は、リスク評価の知見やリスク管理の判断の根拠を含めて、リスクや関 連する事項に関する透明性を関係者間 で高めるプロセスである。"}], "answer": "3", "type": "single", "explanation": "正解（誤っているもの）は ③「食の安全とは、科学的な評価によって、 食品がヒトの健康に悪影響を及ぼすリスクをゼロにす ることである。」。 ポイント：リスクの定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 3, "title": "一般的衛生管理 プログラム", "stem": "次の説明は、一般的衛生管理 プログラム の考え方のうち施設内部 の衛生管理 の重要 なポイントについて 述べたものである。 空欄A～Cに入る語句の組合せとして、 もっとも適切なも のを選択肢から１つ選べ。  【説明】 施設内部 においては、 衛生的な環境を保ち、（ A ）を予防するために、 ゾーニング（ 衛生レベ ルの区分け）を行う。 （ A ）の要素としては人、モノ、（ B ）があるが、その 流れを把握し、（ C ）の可能性を検討 することで、汚染作業区域、準清潔作業区域、清潔作業区域 のようにレイアウト を設定すること になる。", "options": [{"label": "①", "text": "異物混入、設備、 汚染経路"}, {"label": "②", "text": "二次汚染、有害生物、衛生管理"}, {"label": "③", "text": "食中毒、 空気、 衛生管理"}, {"label": "④", "text": "食中毒、 有害生物、交差汚染"}, {"label": "⑤", "text": "二次汚染、空気、 交差汚染"}], "answer": "5", "type": "single", "explanation": "正解（適切なもの）は ⑤「二次汚染、空気、 交差汚染」。 ポイント：交差汚染の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 4, "title": "一般衛生管理", "stem": "一般的衛生管理 プログラム に関連する次の記述のうち、誤っているものを 1つ選べ。", "options": [{"label": "①", "text": "一般的衛生管理 プログラム の主な目的は、食品が衛生的な環境で製造され、汚染の可能性 や程度を最小限にすることである。"}, {"label": "②", "text": "一般的衛生管理 プログラム の考え方は、コーデックス 委員会の食品衛生 の一般原則 がベー スになっている。"}, {"label": "③", "text": "一般的衛生管理 プログラム は、HACCP導入の前提になることから、 前提条件 プログラム （PRP）とも呼ばれている。"}, {"label": "④", "text": "小規模の食品取扱事業者 は、一般的衛生管理 プログラム の実施だけで安全性が確保できる ため、HACCPの考え方の導入は必要ない。"}, {"label": "⑤", "text": "施設や設備・器具 の衛生管理 は、ハード面（施設・設備等 の状況）とソフト面（運用・作業等 の 状況）の両者を相互に補完し、機能させることで 効果が発揮される。"}], "answer": "4", "type": "single", "explanation": "正解（誤っているもの）は ④「小規模の食品取扱事業者 は、一般的衛生管理 プログラム の実施だけで安全性が確保できる ため、HACCPの考え方の導入は必要ない。」。 ポイント：HACCPの定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 5, "title": "HACCP", "stem": "次の記述は、HACCPの考え方について 述べたものであるが、 空欄A～Dに入る語句 の組合せとして、 もっとも適切なものを１つ 選べ。  HACCP では、原材料の受入から最終製品 をお客様に引き渡すまでの工程の中で、どのような （ A ）があるのかをあらかじめ 分析し、その（ A ）の発生を防止するための（ B ）を設定し、そ れを監視することで、 ( C )の安全性を確保しようという 考え方である。 HACCPとは、( C )の検査ではなく、（ D ）で安全を確保する手法と言い換えることができる。", "options": [{"label": "①", "text": "危害要因、重要管理点、最終製品、製造工程"}, {"label": "②", "text": "微生物、 重要管理点、製造工程、最終製品"}, {"label": "③", "text": "危害要因、許容限界、 最終製品、製造工程"}, {"label": "④", "text": "微生物、 許容限界、 最終製品、製造工程"}, {"label": "⑤", "text": "危害要因、監視項目、 製造工程、最終製品"}], "answer": "1", "type": "single", "explanation": "正解（適切なもの）は ①「危害要因、重要管理点、最終製品、製造工程」。 ポイント：HACCPの定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 6, "title": "食品の安全衛生 を管理するための 仕組みや制度", "stem": "食品の安全衛生 を管理するための 仕組みや制度に関する次の記述について、 誤って いるものを１つ 選べ。", "options": [{"label": "①", "text": "HACCPは、安全な食品を製造する手法として考え出されたもので、７ 原則・12手順で構成さ れている。"}, {"label": "②", "text": "ISO22000 とは、PDCAサイクルを基本とした、食品製造業 のための品質マネジメントシステム の国際規格 のことである。"}, {"label": "③", "text": "一般的衛生管理 プログラム の考え方は、コーデックス 委員会の「食品衛生 の一般原則」 がベ ースとなっており、 前提条件プログラム（ PRP）とも呼ばれる。"}, {"label": "④", "text": "FDA（米国医薬食品局） は、組織が食品防御対策 を構築する際に考慮すべきポイントとして、 施設に出入りする従業員、スタッフの身元調査及 び確認などの５項目（ALERT）を示している。"}, {"label": "⑤", "text": "ISO/TS22002 -1では、要求項目 としてフードディフェンス、バイオビジランス およびバイオテロ リズムが記載されている。"}], "answer": "2", "type": "single", "explanation": "正解（適切なもの）は ②「ISO22000 とは、PDCAサイクルを基本とした、食品製造業 のための品質マネジメントシステム の国際規格 のことである。」。 ポイント：用語の定義と、制度/基準の位置づけを押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 7, "title": "食品安全基本法 と食品衛生法", "stem": "食品安全 に関連した法律等に関する次の説明のうち、誤っているものを 1つ選べ。", "options": [{"label": "①", "text": "食品衛生法 では、食品等事業者 の努力義務 の１つとして、 販売食品等 またはその 原料の販売 を行った者の名称等必要 な情報の記録の作成と保存が記載されている。"}, {"label": "②", "text": "食品衛生法 では、腐敗・変敗 した食品、病原微生物 に汚染された食品などの販売・流通 は禁 止しているが、 有害な物質が含有・付着 した食品の流通・販売 は規定されていない。"}, {"label": "③", "text": "食品安全基本法 では、3つの基本理念 に基づき、食品の安全性確保 のために必要な措置を 講じることが 謳われている。"}, {"label": "④", "text": "食品衛生法 に基づく規格基準 による規制が難しく、過去に食中毒や腐敗・変敗 などの多い食 品（弁当・ そうざい、 漬物など）について、 衛生規範 が設けられている。"}, {"label": "⑤", "text": "食品衛生法 では、政令で定める食品の製造または加工を行う営業者に対して、施設ごとに専 任の食品衛生管理者 を置くことを求めている。"}], "answer": "2", "type": "single", "explanation": "正解（誤っているもの）は ②「食品衛生法 では、腐敗・変敗 した食品、病原微生物 に汚染された食品などの販売・流通 は禁 止しているが、 有害な物質が含有・付着 した食品の流通・販売 は規定されていない。」。 ポイント：用語の定義と、制度/基準の位置づけを押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 8, "title": "食品安全 に関連した法律等", "stem": "食品安全 に関連した法令に関する次の記述のうち、誤っているものを 1つ選べ。", "options": [{"label": "①", "text": "「食品表示法」 は、適正な表示を確保することで、 国民の健康を保護・増進 し、消費者の需要 に即した食品の生産の振興に寄与することを 目的としている。"}, {"label": "②", "text": "「牛海綿状脳症対策特別措置法」 は、家畜の伝染病の発生を予防することにより、 ヒトへの疾 病の伝染を防止することを 目的としている。"}, {"label": "③", "text": "「米トレーサビリティ 法」は、安全性を欠く米穀等の流通を防止し、表示の適正化を図ることを 目的としている。"}, {"label": "④", "text": "「農薬取締法」 は、農薬の登録制度 により品質の適正化を図り、販売及び使用の規制等を行 なうことにより、 農薬の安全で適正な使用の確保を図ることを目的としている。"}, {"label": "⑤", "text": "「医薬品医療機器等法」 は、動物用医薬品 を含む医薬品等 の品質、有効性及 び安全性を確 保するために 必要な規制を行うとことを目的としている。"}], "answer": "2", "type": "single", "explanation": "正解（誤っているもの）は ②「「牛海綿状脳症対策特別措置法」 は、家畜の伝染病の発生を予防することにより、 ヒトへの疾 病の伝染を防止することを 目的としている。」。 ポイント：用語の定義と、制度/基準の位置づけを押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 9, "title": "毒素型食中毒 と感染型食中毒", "stem": "細菌性食中毒 は、食中毒を起こすメカニズム により感染型と毒素型に分けられる。 感染 型と毒素型の細菌の組合せとして、 正しいものを 選択肢からそれぞれ１つ 選べ。  A 感染型 B 毒素型", "options": [{"label": "①", "text": "サルモネラ 属菌、カンピロバクター 属菌、セレウス菌（嘔吐型）"}, {"label": "②", "text": "腸炎ビブリオ、 病原大腸菌、 黄色ブドウ球菌"}, {"label": "③", "text": "腸炎ビブリオ、 ボツリヌス 菌、病原大腸菌"}, {"label": "④", "text": "黄色ブドウ球菌、ボツリヌス 菌、セレウス菌（嘔吐型）"}, {"label": "⑤", "text": "サルモネラ 属菌、カンピロバクター 属菌、病原大腸菌"}, {"label": "⑥", "text": "サルモネラ 属菌、ボツリヌス 菌、 ウェルシュ 菌"}], "answer": "A=5,B=4", "type": "multi", "explanation": "正解は A=5, B=4。空欄補充の設問は“文章として自然か”＋“用語の定義/制度上の位置づけ”で判断します。（※学習補助の要約／公式解説ではありません）"}, {"id": 10, "title": "食中毒起因微生物 に関する用語", "stem": "次に示す食中毒起因微生物 に関する用語の説明のうち、誤っているものを１つ 選べ。", "options": [{"label": "①", "text": "毒素型食中毒 とは、食品に付着した食中毒起因菌 を一定量摂取後、 これらの菌が腸管内で 毒素を産生することによって 食中毒症状 を起こすことをいう。"}, {"label": "②", "text": "二次汚染 とは、調理中の食品が、まな板や調理器具類、 あるいは調理するヒトの手を介して 食中毒菌 やウイルスに汚染されることをいう。"}, {"label": "③", "text": "芽胞とは、ある 種の細菌が乾燥、高温 などの環境条件 が悪くなった際に、生き延びるために 作る耐久性の高い細胞構造 のことをいう。"}, {"label": "④", "text": "不顕性感染 とは、腸管出血性大腸菌 やノロウイルス などの病原性のある微生物に感染しても 何ら症状を示さず、自覚症状 もない状態をいう。"}, {"label": "⑤", "text": "Ｄ値とは、最初の菌数を1/10 （90％を死滅）に減少させるのに 要する加熱時間 を時間単位 で表したものをいう。"}], "answer": "1", "type": "single", "explanation": "正解（誤っているもの）は ①「毒素型食中毒 とは、食品に付着した食中毒起因菌 を一定量摂取後、 これらの菌が腸管内で 毒素を産生することによって 食中毒症状 を起こすことをいう。」。 ポイント：食中毒の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 11, "title": "食品の腐敗防止", "stem": "食品の腐敗防止 に関する次の記述のうち、誤っているものを 1つ選べ。", "options": [{"label": "①", "text": "酢漬けや漬け物、ヨーグルト などは酢酸や乳酸によって食品のpHが低下することを 利用した 保存法で、一般にpH5.5 以下になると腐敗防止効果 が大きい。"}, {"label": "②", "text": "低温殺菌 と呼ばれる方法は、食品の品質になるべく 影響を与えないために、 60～65℃程度の 比較的緩 い加熱によって、 問題となる病原菌や腐敗菌を殺すための 方法である。"}, {"label": "③", "text": "凍結条件下 では微生物の活性は完全に停止し、死滅するので、 食品は長期間貯蔵すること ができる。"}, {"label": "④", "text": "微生物の殺菌には加熱が最もよく用いられ、缶詰やレトルト食品では、120℃、4分の加熱ま たはそれと 同等以上 の殺菌効果 のある方法を用いることが 決められている。"}, {"label": "⑤", "text": "食品を5～10℃以下で保存すれば、動物の皮膚や腸内に由来する中温性の腐敗細菌 はほと んど増殖せず、増殖可能 なものでも 一般に低温になるほど 増殖速度 が低下する。"}], "answer": "3", "type": "single", "explanation": "正解（誤っているもの）は ③「凍結条件下 では微生物の活性は完全に停止し、死滅するので、 食品は長期間貯蔵すること ができる。」。 ポイント：用語の定義と、制度/基準の位置づけを押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 12, "title": "食中毒、腐敗、発酵", "stem": "食品の食中毒、腐敗、発酵 に関する次の記述について、 誤っているものを１つ 選べ。", "options": [{"label": "①", "text": "食中毒菌 が増殖しても、食品は外見上、著 しい変化を伴わないことが 多いため、臭いや見か けで判断することは 難しい。"}, {"label": "②", "text": "特定の微生物が食品中で増殖、または毒素を産生し、それを 食べたヒトがその微生物特有 の 症状を起こすことを 微生物性食中毒 という。"}, {"label": "③", "text": "腐敗は、食品の種類ごとに決まった特定の微生物が起こすもので、 臭いや味、外観の変化に より感知できる。"}, {"label": "④", "text": "微生物作用 のうち、人間生活に有益な場合を発酵という。"}, {"label": "⑤", "text": "発酵は、主に糖類が分解されて乳酸やアルコール などを生成することであるが、 タンパク質が 分解される場合も発酵ということがある。"}], "answer": "3", "type": "single", "explanation": "正解（誤っているもの）は ③「腐敗は、食品の種類ごとに決まった特定の微生物が起こすもので、 臭いや味、外観の変化に より感知できる。」。 ポイント：食中毒の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 13, "title": "カンピロバクター 属菌の特徴と予防対策", "stem": "カンピロバクター 属菌に関する次の記述のうち、誤っているものを１つ 選べ。", "options": [{"label": "①", "text": "カンピロバクター 属菌は、低温に弱く、5℃以下の冷蔵状態 では徐々に死滅するため、 冷蔵保 管が有効である。"}, {"label": "②", "text": "一般的な加熱調理 では、食品の中心部で75℃、1分間以上 の加熱が必要である。"}, {"label": "③", "text": "400～500個程度の摂取で発症する少量感染菌 である。"}, {"label": "④", "text": "カンピロバクター による胃腸炎が症状が治まってから 10日以上経過後 にギランバレー 症候群 を発症することがある。"}, {"label": "⑤", "text": "鶏肉の生食を止めることによって、 カンピロバクター 属菌による食中毒を減らすことができる。"}], "answer": "1", "type": "single", "explanation": "正解（誤っているもの）は ①「カンピロバクター 属菌は、低温に弱く、5℃以下の冷蔵状態 では徐々に死滅するため、 冷蔵保 管が有効である。」。 ポイント：カンピロの定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 14, "title": "サルモネラ 属菌による食中毒事件事例", "stem": "次のようなサルモネラ 属菌の食中毒事件 が発生した。事例に共通する予防対策 とし て、もっとも重要と思われるものを 選択肢から１つ選べ。  【事件１】  学校給食 センターで調理した給食を喫食した小中学校 の生徒および職員1,529名が下 痢・発熱等 の症状を起こした。原因食品 は「きゅうり・わかめ・ カニかまぼこの 酢の物」であっ た。  酢の物の調味液を撹拌する際に使用されたフードミキサー は、2日前にカニスープ 用の鶏 卵の攪拌にも使用していた。 【事件2】  学校給食 センターで調理した給食を喫食した小中学校 の生徒64名が下痢、腹痛、発熱等 の症状を起こした。原因食品 は「もやし ナムル」であった。  2日前のかき玉汁に使用した泡だて器をもやしナムルの調味液の撹拌に使用していた。", "options": [{"label": "①", "text": "調理従事者 は、排便後、調理前、衛生手袋着用前 などの手洗いを徹底する。"}, {"label": "②", "text": "調理従事者 は、定期的に検便を実施し、サルモネラ 属菌等陽性 の時は直接食品 に触れない ようにする。"}, {"label": "③", "text": "調理器具、容器等 は、洗浄消毒、衛生的保管 を徹底し、用途別、食品別 にそれぞれ 専用の ものを使用する。"}, {"label": "④", "text": "調理従事者 のエプロン等調理作業着 の洗濯は、クリーニング 店で行う。"}, {"label": "⑤", "text": "調理従事者 は、サルモネラ が増殖しないよう、 卵の割置きや継ぎ足しをはしない。"}], "answer": "3", "type": "single", "explanation": "正解（適切なもの）は ③「調理器具、容器等 は、洗浄消毒、衛生的保管 を徹底し、用途別、食品別 にそれぞれ 専用の ものを使用する。」。 ポイント：食中毒の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 15, "title": "食中毒事例 と食中毒起因物質", "stem": "次の説明は、ある食中毒起因物質 について 述べたものである。 もっとも可能性の高い 食中毒起因物質 を選択肢から１つ選べ。  【説明】  熊本県の避難所で配られたおにぎりによる 食中毒が発生した。  原因物質 は、自然界に広く分布しているが、 健康な人でも高い割合（20％～30％以上）で 保菌している。  調理作業 に携わる際の手指の洗浄・消毒 を確実に行い、合成樹脂製 の使い捨て手袋を活 用するなどの 予防対策 が必要である。", "options": [{"label": "①", "text": "黄色ブドウ球菌"}, {"label": "②", "text": "ボツリヌス 菌"}, {"label": "③", "text": "セレウス菌"}, {"label": "④", "text": "リステリア ・モノサイトゲネス"}, {"label": "⑤", "text": "エルシニア・エンテロコリチカ"}], "answer": "1", "type": "single", "explanation": "正解（適切なもの）は ①「黄色ブドウ球菌」。 ポイント：食中毒の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 16, "title": "腸管出血性大腸菌 の特徴と予防対策", "stem": "腸管出血性大腸菌 に関する次の記述のうち、誤っているものを１つ 選べ。", "options": [{"label": "①", "text": "牛などの家畜の腸管内に生息しているため、これらの 動物の糞便が食肉や水を汚染して感 染源になる。"}, {"label": "②", "text": "発症に必要な菌量は10万個以上 で、腸管に到達した菌により食中毒を起こす。"}, {"label": "③", "text": "潜伏期間 は平均1～10日で、初期は軽度な胃腸炎症状 で風邪の症状にも似ているが、 症状 が悪化するとHUS（溶血性尿毒症症候群） により死亡することもある。"}, {"label": "④", "text": "調理場内 において、 食肉類の取扱いが悪いため二次汚染 による食中毒を起こすことがある。"}, {"label": "⑤", "text": "未殺菌の井戸水や沢水をそのまま 調理に使用せず、定期的に水質検査 を受け、確実に殺菌 された飲用に適した水を使うようにする。"}], "answer": "2", "type": "single", "explanation": "正解（誤っているもの）は ②「発症に必要な菌量は10万個以上 で、腸管に到達した菌により食中毒を起こす。」。 ポイント：食中毒の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 17, "title": "腸炎ビブリオの特徴と予防対策", "stem": "腸炎ビブリオに関する次の記述のうち、誤っているものを１つ 選べ。", "options": [{"label": "①", "text": "魚介類の体表やエラに付着した菌が魚介類といっしょに 陸揚げされ、この 菌が増殖した刺し 身や貝を食べることで 食中毒を引き起こす。"}, {"label": "②", "text": "魚介類の流通、保存、調理 の過程では低温で保管して、菌の増殖機会 を与えないようにし、 冷凍魚介類 を解凍する際は、冷蔵庫内 などで行う。"}, {"label": "③", "text": "魚介類を扱ったまな板やふきん、 包丁は、魚介類専用 のものを使い、二次汚染 を防止する。"}, {"label": "④", "text": "食塩濃度 が10％程度の最適な条件下では、もっとも速く分裂・増殖 を繰り返す。"}, {"label": "⑤", "text": "食塩の存在しない真水中では速やかに死滅するため、 魚介類は調理前に真水で十分に洗っ て菌を取り除く。"}], "answer": "4", "type": "single", "explanation": "正解（誤っているもの）は ④「食塩濃度 が10％程度の最適な条件下では、もっとも速く分裂・増殖 を繰り返す。」。 ポイント：用語の定義と、制度/基準の位置づけを押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 18, "title": "ボツリヌス 菌の特徴と予防", "stem": "ボツリヌス 菌に関する次の記述のうち、誤っているものを 1つ選べ。", "options": [{"label": "①", "text": "土壌、海や河川等の泥の中など自然界に広く分布している。"}, {"label": "②", "text": "酸素のない条件下で増殖する嫌気性菌 で、缶詰や瓶詰、真空 パック食品による事故が多い。"}, {"label": "③", "text": "ボツリヌス 菌の毒素は耐熱性であり、100℃、10分間程度 の加熱では無毒化することはできな い。"}, {"label": "④", "text": "加熱調理食品 を容器包装 に保存する時には、水分活性、 pH、温度などを調整して、食品中 で増殖できない状態にすることが 重要である。"}, {"label": "⑤", "text": "ハチミツに含まれる芽胞が、1歳未満の乳児の腸管内で増殖して食中毒を起こすことがある。"}], "answer": "3", "type": "single", "explanation": "正解（誤っているもの）は ③「ボツリヌス 菌の毒素は耐熱性であり、100℃、10分間程度 の加熱では無毒化することはできな い。」。 ポイント：用語の定義と、制度/基準の位置づけを押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 19, "title": "ウェルシュ 菌による食中毒事件事例", "stem": "次のような食中毒が発生した。この 食中毒の原因として考えられるもののうち、 もっとも 可能性の高いものを１つ 選べ。  【概要】  10月のよく晴れた日、地域で開催された運動会において、 持ち帰り専門の弁当屋から弁当 を購入した参加者のうち、190人が翌日から下痢、腹痛、吐 き気、倦怠感 などの症状を呈し た。  ほぼ全員からウェルシュ 菌が検出され、また、 弁当残品 35検体中、12検体からもウェルシ ュ菌が検出された。  弁当屋は、通常の稼働能力 を超えた予約数の注文に対応するため、 数日前から調理を行 っていた。", "options": [{"label": "①", "text": "厨房の調理能力 を超えた予約数の弁当を調理したため、 加熱温度 の確認を十分に行わなか った。"}, {"label": "②", "text": "調理能力 を超過していたため、 調理器具類 の使い分けや洗浄・消毒 が十分でなかった。"}, {"label": "③", "text": "忙しさのため 従事者の服装・身だしなみの 確認や手洗いが不十分であった。"}, {"label": "④", "text": "冷蔵保管設備 が不足しており、 加熱調理後、食品 が長時間常温 で保管された。"}, {"label": "⑤", "text": "運動会当日 の気候が快晴であり、会場での保管状況 に問題があった。"}], "answer": "4", "type": "single", "explanation": "正解（適切なもの）は ④「冷蔵保管設備 が不足しており、 加熱調理後、食品 が長時間常温 で保管された。」。 ポイント：食中毒の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 20, "title": "ノロウイルス による食中毒事件事例", "stem": "次のようなノロウイルス による食中毒事件 が発生した。この 食中毒事件事例 の汚染経路 として、もっとも可能性が高いと考えられるものを 1つ選べ。  【事例】  幼稚園で開催された餅つきイベントにより、園児、家族、職員等 130人以上がノロウイルス に感染し、発症した。  臼と杵などの用具はイベント前日に洗浄され、次亜塩素酸 ナトリウム 溶液で消毒後に覆い をかけて保管されていた。  もち米はイベント当日にセイロで蒸された後に、講堂にて園児、父兄等 が交代で餅をつき あげた。  保健所の調査では、当日、参加者 におう吐・下痢等 の体調不良患者 はいなかった。  餅は別室に運ばれて、各担当者 により、あん、みたらしなど 5種類の味付けがなされた。  餅の味付けの違いによる患者発生率 の差は確認されなかった。", "options": [{"label": "①", "text": "臼、杵などの餅つき用具のノロウイルス 汚染"}, {"label": "②", "text": "原料のもち米自体のノロウイルス 汚染"}, {"label": "③", "text": "もち米をつき上げる工程におけるノロウイルス 混入"}, {"label": "④", "text": "つきあがった 餅への空気中からのノロウイルス 混入"}, {"label": "⑤", "text": "餅の味付け時の取扱い不良によるノロウイルス 汚染"}], "answer": "3", "type": "single", "explanation": "正解（適切なもの）は ③「もち米をつき上げる工程におけるノロウイルス 混入」。 ポイント：食中毒の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 21, "title": "ノロウィルス の特徴と予防対策", "stem": "ノロウイルス の特徴に関する次の記述のうち、誤っているものを 1つ選べ。", "options": [{"label": "①", "text": "100個以下のごく少量のウイルスが口に入ることでも 感染するが、感染者のふん便1g当たり には、100万個個以上 のウイルスが含まれている。"}, {"label": "②", "text": "近年のノロウイルス による食中毒発生原因 の多くは調理従事者由来 であり、おう 吐、下痢など の症状がある調理者に限定した対策が課題となっている。"}, {"label": "③", "text": "感染すると、症状消失後 1週間から1ヶ月以上の長期間にわたり便中にウイルスが排出され 続けることがある。"}, {"label": "④", "text": "一般に、汚れた環境（共存有機物 が多い状態）にあるほど 長く生存し、液体中よりも乾燥状態 で長く生存する傾向がある。"}, {"label": "⑤", "text": "ノロウイルス が付着した製品をパック詰めして長期間常温 で保管すると、パック内の食品中で ノロウイルス が増殖することはないが、 長期間感染力 を維持する。"}], "answer": "2", "type": "single", "explanation": "正解（誤っているもの）は ②「近年のノロウイルス による食中毒発生原因 の多くは調理従事者由来 であり、おう 吐、下痢など の症状がある調理者に限定した対策が課題となっている。」。 ポイント：食中毒の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 22, "title": "リステリア・モノサイトゲネス の特徴と予防対策", "stem": "リステリア・モノサイトゲネス に関する次の記述のうち、誤っているものを１つ 選べ。", "options": [{"label": "①", "text": "本菌による食中毒の原因食品 は特徴的で、乳製品に限られる。"}, {"label": "②", "text": "食中毒症状 は一般的には軽症だが、妊婦、高齢者 などは髄膜炎や敗血症を伴い重症化す る危険がある。"}, {"label": "③", "text": "本菌の発育温度帯 は0～45℃と広く、冷蔵庫内 の低温下でも増殖可能 である。"}, {"label": "④", "text": "食品の製造ラインなどに定着し、長期にわたり食品を汚染し続けて、食中毒の原因となること がある。"}, {"label": "⑤", "text": "本菌は耐塩性は強いが、耐熱性は強くないので、 食中毒予防 のための加熱調理 は有効であ る。"}], "answer": "1", "type": "single", "explanation": "正解（誤っているもの）は ①「本菌による食中毒の原因食品 は特徴的で、乳製品に限られる。」。 ポイント：食中毒の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 23, "title": "食中毒起因物質 と主な原因食品", "stem": "次に示す食中毒起因物質 と主な原因食品 の組合せのうち、 誤っているものを１つ 選 べ。", "options": [{"label": "①", "text": "ノロウイルス ⇔ カキ、アサリ、シジミ などの二枚貝、調理工程 で二次汚染 を受けた食品"}, {"label": "②", "text": "セレウス菌 ⇔ チャーハン、ピラフ、パスタ 類などの穀類を用いて調理した食品"}, {"label": "③", "text": "ウェルシュ 菌 ⇔ 魚介類を使用した刺し身やすし"}, {"label": "④", "text": "エルシニア・エンテロコリチカ ⇔ 食肉（ブタの腸内保菌率 が高い）、野生生物 の糞便により 汚染された沢水"}, {"label": "⑤", "text": "ボツリヌス 菌 ⇔ 缶詰、瓶詰食品、真空 パック詰めされた食品"}], "answer": "3", "type": "single", "explanation": "正解（誤っているもの）は ③「ウェルシュ 菌 ⇔ 魚介類を使用した刺し身やすし」。 ポイント：食中毒の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 24, "title": "生食と食中毒起因物質", "stem": "近年、生食 が美味しいなどの 理由もあり、肉類などの生食によって多くの食中毒が発生 している。 次のＡ、Ｂの食品を生食した場合、もっとも発生の可能性の高い食中毒起因物質 を選 択肢からそれぞれ１つ 選べ。  Ａ: 鶏肉の生食、沢水 Ｂ: シカ、イノシシ、 豚肉", "options": [{"label": "①", "text": "腸管出血性大腸菌"}, {"label": "②", "text": "Ｅ型肝炎ウイルス"}, {"label": "③", "text": "腸炎ビブリオ"}, {"label": "④", "text": "サルモネラ 属菌"}, {"label": "⑤", "text": "カンピロバクター 属菌"}, {"label": "⑥", "text": "ウェルシュ 菌"}], "answer": "A=5,B=2", "type": "multi", "explanation": "正解は A=5, B=2。空欄補充の設問は“文章として自然か”＋“用語の定義/制度上の位置づけ”で判断します。（※学習補助の要約／公式解説ではありません）"}, {"id": 25, "title": "寄生虫による食中毒例", "stem": "次の記述は寄生虫による食中毒について 説明したものである。 空欄（ A ）に入るもの として、もっとも適切なものを１つ 選べ。  【説明】  厚生労働省 の食中毒統計 では、2013年から寄生虫による病因物質 として（ A ）が明記さ れるようになった。 2013年は88件、2014年は79件、2015年は127件と食中毒全体 の発 生件数の１割を占めている。  （ A ）による食中毒は以前からあったが、 近年、増えた理由として、寄生虫による食中毒 が病因物質 として明確化されたため 医師の届出数が増えたこと、 冷蔵保管運搬技術 の進 歩によりサンマなども刺身で食べられるようになったこと、 海水の温暖化等 の影響で魚の寄 生虫が増えたことなどが 挙げられる。", "options": [{"label": "①", "text": "クリプトスポリジウム"}, {"label": "②", "text": "クドア"}, {"label": "③", "text": "サルコシスティス"}, {"label": "④", "text": "アニサキス"}, {"label": "⑤", "text": "回虫"}], "answer": "4", "type": "single", "explanation": "正解（適切なもの）は ④「アニサキス」。 ポイント：食中毒の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 26, "title": "寄生虫と関連性の高い食品", "stem": "次のＡ～Ｄの食品（食材） と人の健康障害 に関係の深い寄生虫の組合せとして、 正しい ものを1つ選べ。  （Ａ）野菜類 （Ｂ）ヒラメ （Ｃ）馬肉 （Ｄ）水", "options": [{"label": "①", "text": "回虫、 クドア、 サルコシスティス、 クリプトスポリジウム"}, {"label": "②", "text": "クリプトスポリジウム、 回虫、 肺吸虫、 サルコシスティス"}, {"label": "③", "text": "回虫、 クリプトスポリジウム、 サルコシスティス、 肺吸虫"}, {"label": "④", "text": "有鉤条虫、 クドア、 サルコシスティス、 クリプトスポリジウム"}, {"label": "⑤", "text": "エキノコックス、 クドア、 肺吸虫、 サルコシスティス"}], "answer": "1", "type": "single", "explanation": "正解（正しいもの）は ①「回虫、 クドア、 サルコシスティス、 クリプトスポリジウム」。 ポイント：用語の定義と、制度/基準の位置づけを押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 27, "title": "シガテラ毒による食中毒", "stem": "次の記述はシガテラ毒について 説明したものであるが、 空欄A～Cに入る語句の組合 せとして、もっとも 適切なものを選択肢から１つ選べ。   シガテラとは、熱帯から亜熱帯海域、特 にサンゴ礁海域に生息する魚類の摂食によって引 き起こされる致死率の（ A ）食中毒の総称で、シガテラの特徴的な症状は（ B ）という温 度感覚の異常である。  シガテラ毒魚は（ C ）以上に及ぶといわれており、 シガテラ毒魚は、都道府県 ごとに食用と しないよう 指導し、中毒の防止を図っている。", "options": [{"label": "①", "text": "低い、ドライアイスセンセーション、 4,000種"}, {"label": "②", "text": "高い、アナフィラキシーショック、 400種"}, {"label": "③", "text": "低い、アナフィラキシーショック、 4,000種"}, {"label": "④", "text": "高い、ドライアイスセンセーション、 4,000種"}, {"label": "⑤", "text": "低い、ドライアイスセンセーション、 400種"}], "answer": "5", "type": "single", "explanation": "正解（適切なもの）は ⑤「低い、ドライアイスセンセーション、 400種」。 ポイント：食中毒の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 28, "title": "フグの毒性および予防対策", "stem": "フグの毒性および予防対策 に関する次の記述のうち、誤っているものを 選択肢から１つ 選べ。", "options": [{"label": "①", "text": "フグの毒性は、種類、個体差、組織（部位）、生息海域等 によって異なるため、 同じ種類のフ グでもその毒性には差がある。"}, {"label": "②", "text": "フグ毒の本体はテトロドトキシン と呼ばれる神経毒で、熱に比較的強 いが、十分に時間をかけ て煮る、焼くなどの加熱調理 を行えば無毒化することができる。"}, {"label": "③", "text": "フグ毒の致死時間 は、食後4～6時間で、中毒症状 が現れても、適切な処置をして8時間以 上生命を維持できれば回復するといわれている。"}, {"label": "④", "text": "フグ毒はフグ以外の生物にも広く分布し、巻貝類に含まれるフグ毒で食中毒を起こすことがあ る。"}, {"label": "⑤", "text": "現在のところフグ中毒に対する有効な解毒剤はない。"}], "answer": "2", "type": "single", "explanation": "正解（誤っているもの）は ②「フグ毒の本体はテトロドトキシン と呼ばれる神経毒で、熱に比較的強 いが、十分に時間をかけ て煮る、焼くなどの加熱調理 を行えば無毒化することができる。」。 ポイント：用語の定義と、制度/基準の位置づけを押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 29, "title": "キノコ毒による食中毒", "stem": "次の記述はわが国のキノコ毒による食中毒の特徴について 述べたものである。 キノコ中 毒に関する記述として、誤っているものを 選択肢から１つ選べ。", "options": [{"label": "①", "text": "キノコの毒成分はキノコの種類によって多様であるが、いずれも 化学的に安定な物質で、通 常の加熱調理 で毒性を失うことはない。"}, {"label": "②", "text": "キノコ毒の成分により消化器系症状、 コレラ様症状、神経系症状 などを発症し、重篤な場合に は死に至ることがある。"}, {"label": "③", "text": "ツキヨタケ の名前は暗所で青白いりん光を発することに 由来し、形はヒラタケ、 色はシイタケに 似ているのでしばしば 誤食され、多くの中毒患者 を出している。"}, {"label": "④", "text": "キノコ中毒は梅雨の時期の6月と7月に集中しており、この 2か月で件数および患者数の約 90％を占める。"}, {"label": "⑤", "text": "クサウラベニタケ は、食用のホンシメジ やウラベニホテイシメジ に似ているため、しばしば 誤食 され、多くの中毒患者 を出している。"}], "answer": "4", "type": "single", "explanation": "正解（誤っているもの）は ④「キノコ中毒は梅雨の時期の6月と7月に集中しており、この 2か月で件数および患者数の約 90％を占める。」。 ポイント：食中毒の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 30, "title": "有毒植物 による食中毒", "stem": "次の記述は食中毒を起こす高等植物 について 説明したものである。 説明に該当する高 等植物を選択肢から1つ選べ。  【説明】  塊根を乾燥させたものは、 古くから強心薬や狩猟用の矢毒として利用されてきた。  春先の新芽は、キンポウゲ 科のニリンソウ やキク科のモミジガサ とよく似ているので 誤食され る。", "options": [{"label": "①", "text": "トリカブト"}, {"label": "②", "text": "イヌサフラン"}, {"label": "③", "text": "チョウセンアサガオ"}, {"label": "④", "text": "クワズイモ"}, {"label": "⑤", "text": "スイセン"}], "answer": "1", "type": "single", "explanation": "正解（適切なもの）は ①「トリカブト」。 ポイント：食中毒の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 31, "title": "化学物質 と規制", "stem": "食品に対する化学物質 の規制に関する次の記述のうち、誤っているものを 選択肢から １つ選べ。", "options": [{"label": "①", "text": "米（玄米および精米）に含まれる鉛の濃度には規制値が設けられている。"}, {"label": "②", "text": "魚介類に含まれる水銀には暫定的規制値 が定められており、 規制値以上 の濃度の水銀を含 む魚介類の流通を禁止している。"}, {"label": "③", "text": "ヒジキは毒性が高い無機ヒ素を多く含むことから、 イギリスやカナダでは摂食を控えるよう行政 指導が行われている。"}, {"label": "④", "text": "ビスフェノール Aは代表的な内分泌攪乱化学物質 であり、ポリカーボネ ート製容器からのビス フェノール Aの溶出には規制値が設けられている。"}, {"label": "⑤", "text": "PCBによる各種食品 の汚染実態 を考慮して、魚介類、乳製品 など各種食品 に対して、PCBの 暫定的規制値 が設定されている。"}], "answer": "1", "type": "single", "explanation": "正解（誤っているもの）は ①「米（玄米および精米）に含まれる鉛の濃度には規制値が設けられている。」。 ポイント：用語の定義と、制度/基準の位置づけを押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 32, "title": "カビ毒", "stem": "カビ毒に関する次の記述について、 誤っているものを１つ 選べ。", "options": [{"label": "①", "text": "カビの二次代謝産物 で、急性毒性 あるいは慢性毒性 を示す物質をマイコトキシン（カビ 毒）と いい、土壌に常在するカビ毒産生菌 が農作物を容易に汚染してカビ毒を産生する。"}, {"label": "②", "text": "アフラトキシン は、急性毒性 だけでなく、 天然物の中で最強の肝発がん物質といわれており、 食品中の総アフラトキシン に対して規制基準 を設けている。"}, {"label": "③", "text": "傷ついたりんごや 腐敗したりんごに 付着したカビ類が、毒成分であるパツリンを産生するため、 わが国ではりんご 果汁に対してパツリンの規制基準 を設けている。"}, {"label": "④", "text": "赤カビが産生する毒成分デオキシニバレノール は、成長抑制、体重低下 などの慢性毒性 が あるとされているが、 死亡例はなく、わが 国ではまだ規制されていない。"}, {"label": "⑤", "text": "アフラトキシン を産生するカビは、熱帯から亜熱帯地域 の土壌に生息しており、 ナッツ類や香 辛料などの輸入品は監視対象 として注意が必要である。"}], "answer": "4", "type": "single", "explanation": "正解（誤っているもの）は ④「赤カビが産生する毒成分デオキシニバレノール は、成長抑制、体重低下 などの慢性毒性 が あるとされているが、 死亡例はなく、わが 国ではまだ規制されていない。」。 ポイント：カビ毒の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 33, "title": "ヒスタミンによるアレルギー 様食中毒", "stem": "次の記述はヒスタミン によるアレルギー 様食中毒 について 説明したものであるが、 誤っ ているものを１つ 選べ。", "options": [{"label": "①", "text": "アレルギー 様食中毒 の原因となるヒスタミン は、赤身魚に多く含まれるヒスチジン が微生物の 作用を受けて生成される。"}, {"label": "②", "text": "アレルギー 様食中毒 は食後数分 から30分位で発症し、顔面の紅潮、頭痛、 じんましん、 発熱 などの症状を示すが、6～10時間で回復し、死亡することはない。"}, {"label": "③", "text": "低温でもヒスタミンを作る細菌があるので、 魚介類は5℃以下でも長期間保存 はしない。"}, {"label": "④", "text": "ヒスタミンが蓄積してもほとんど 味は変わらないが、 辛みを感じたり舌がぴりぴりすることがある。"}, {"label": "⑤", "text": "サバなどの缶詰は殺菌されているので、 アレルギー 様食中毒 は起こらない。"}], "answer": "5", "type": "single", "explanation": "正解（適切なもの）は ⑤「サバなどの缶詰は殺菌されているので、 アレルギー 様食中毒 は起こらない。」。 ポイント：アレルの定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 34, "title": "食物アレルギー の原因食品", "stem": "次の表はわが国において、 各年齢群 で5%以上を占める食物アレルギー の原因食品 （上位3食品）を示している。 Ａ～Ｃに入る原因食品 の組合せとして、 もっとも適切なものを選択 肢から１つ選べ。  表 年齢層別 アレルギー 原因食品（粗集計） 年齢 0歳 1-2歳 3-6歳 7-17歳 18歳以上 第１位 Ａ Ａ Ｂ 牛乳 小麦 第２位 牛乳 牛乳 牛乳 Ｂ Ｃ 第３位 小麦 Ｂ Ａ Ａ 果実類 （出典）消費者庁（ 2021年度調査）", "options": [{"label": "①", "text": "Ａ：鶏卵、 Ｂ：木の実類、Ｃ：甲殻類"}, {"label": "②", "text": "Ａ：大豆、 Ｂ：甲殻類、 Ｃ：木の実類"}, {"label": "③", "text": "Ａ：木の実類、Ｂ：鶏卵、 Ｃ：甲殻類"}, {"label": "④", "text": "Ａ：鶏卵、 Ｂ：甲殻類、 Ｃ：木の実類"}, {"label": "⑤", "text": "Ａ：大豆、 Ｂ：鶏卵、 Ｃ：甲殻類"}], "answer": "1", "type": "single", "explanation": "正解（適切なもの）は ①「Ａ：鶏卵、 Ｂ：木の実類、Ｃ：甲殻類」。 ポイント：アレルの定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 35, "title": "食物アレルギー の発症機構", "stem": "次の記述は、食物アレルギー について 述べたものであるが、 誤っているものを 1つ選 べ。", "options": [{"label": "①", "text": "鶏卵のアレルゲン は主に卵白に含まれている。"}, {"label": "②", "text": "そばアレルギー は症状が特に激しく、いったん 感作されるとほぼ 一生持続 する傾向がある。"}, {"label": "③", "text": "ピーナッツアレルギー は米国では特に有名で、多くの死者を出している。"}, {"label": "④", "text": "食物アレルギー はイムノグロブリン Ｅ（IgE）という抗体が関与する即時型アレルギー で、アレル ギー体質の人は、アレルゲンタンパク 質に対してIgEを作りやすい。"}, {"label": "⑤", "text": "食物アレルギー はアレルゲン が腸管から吸収されるので、 花粉症やダニアレルギー とは発症 機構が異なる。"}], "answer": "5", "type": "single", "explanation": "正解（誤っているもの）は ⑤「食物アレルギー はアレルゲン が腸管から吸収されるので、 花粉症やダニアレルギー とは発症 機構が異なる。」。 ポイント：アレルの定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 36, "title": "アレルギー 原因食品 とアレルゲン", "stem": "アレルギー 原因食品 とその主要なアレルゲン について、 次の食品A、Bの主要なアレ ルゲンとして、適当なものを選択肢からそれぞれ１つ 選べ。  A：卵（鶏卵） B：小麦", "options": [{"label": "①", "text": "オボムコイド、オボアルブミン"}, {"label": "②", "text": "αs1-カゼイン、 β-ラクトグロブリン"}, {"label": "③", "text": "α-アミラーゼインヒビター、 α-グリアジン"}, {"label": "④", "text": "16kDaと24kDaのタンパク質"}, {"label": "⑤", "text": "トロポミオシン"}], "answer": "A=1,B=3", "type": "multi", "explanation": "正解は A=1, B=3。空欄補充の設問は“文章として自然か”＋“用語の定義/制度上の位置づけ”で判断します。（※学習補助の要約／公式解説ではありません）"}, {"id": 37, "title": "アレルギー を起こすおそれのある 原材料を含む加工食品 の表示制度 （2025年5月時点）", "stem": "アレルギー を起こすおそれのある 原材料を含む加工食品 の表示制度 について、 表示 が義務化されている 特定原材料 8品目に該当するものを ①～⑥より3つ選べ。", "options": [{"label": "①", "text": "えび"}, {"label": "②", "text": "かに"}, {"label": "③", "text": "いくら"}, {"label": "④", "text": "さば"}, {"label": "⑤", "text": "落花生"}, {"label": "⑥", "text": "大豆"}], "answer": "1", "type": "single", "explanation": "正解（適切なもの）は ①「えび」。 ポイント：アレルの定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 38, "title": "アレルゲン の管理対策・表示", "stem": "アレルゲン の管理対策・表示 について、 誤っているものを１つ 選べ。", "options": [{"label": "①", "text": "食品表示法 では、スクリーニング 検査の結果が陰性であっても、 製造記録 に特定原材料 の記 載がある場合など、アレルギー 表示を推奨されるケースがある。"}, {"label": "②", "text": "複合原料 を外部から仕入れて使う場合には、サイレントチェンジ にも十分注意 を払う必要があ る。"}, {"label": "③", "text": "保管・輸送段階 での交差接触 を避けるために、 アレルゲン を含むものの保管用容器 や輸送用 容器を専用化する。"}, {"label": "④", "text": "原材料の変更に伴い、アレルゲン の種類や含有量が変化する場合には、商品パッケージ のデ ザインを変えるなど、 消費者に分かりやすく 注意喚起 する。"}, {"label": "⑤", "text": "同一製造 ラインを使用するなど、ある 特定原材料等 が意図せず混入することが 想定できる場 合には、「入っているかもしれません」といった 可能性表示 を行う。"}], "answer": "5", "type": "single", "explanation": "正解（誤っているもの）は ⑤「同一製造 ラインを使用するなど、ある 特定原材料等 が意図せず混入することが 想定できる場 合には、「入っているかもしれません」といった 可能性表示 を行う。」。 ポイント：アレルの定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 39, "title": "食物アレルギー による事件事例", "stem": "次のような食物アレルギー による事故が起こった。このような 事例を予防するために 旅 館側に望まれる次の対策のうち、不適切なものを１つ 選べ。  【概要】  温泉に家族で行くことになり、 母親は子どもに牛乳アレルギー があることを 旅館に伝え、除 去食の打合せを済ませていた。  ところが当日になって使用している食品に変更があり、食事に出されたチーズ入りウインナ ーを子どもが食べたところ、 30分位で口の中がビリビリすると泣き出し、その後顔や身体が 腫れ上がった。  その日は、あいにく 打合せ担当者が休んだため、 不在であり、打合せの記録も残っていな かった。", "options": [{"label": "①", "text": "旅館の打合せ担当者と調理担当者 との連絡体制 を確立する。"}, {"label": "②", "text": "調理担当者 だけでなく、 旅館全体 の問題として従業員に食物アレルギー に関する十分な教 育を行う。"}, {"label": "③", "text": "原材料に含まれるアレルゲン の情報を把握する責任者を１人決め、その者が打合せから除去 食の調理までを一貫して行うように努める。"}, {"label": "④", "text": "使用する原材料、提供 する食品の情報を正確に把握する。"}, {"label": "⑤", "text": "食物アレルギー は、微量のアレルゲン の存在下でも起きる可能性があることから、 器具の専用 化などにより、 交差汚染 の予防についても 考慮する。"}], "answer": "3", "type": "single", "explanation": "正解（適切なもの）は ③「原材料に含まれるアレルゲン の情報を把握する責任者を１人決め、その者が打合せから除去 食の調理までを一貫して行うように努める。」。 ポイント：アレルの定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 40, "title": "食品への異物混入", "stem": "食品への異物混入 に関する次の記述について、 誤っているものを１つ 選べ。", "options": [{"label": "①", "text": "食品への異物混入 とは、本来その食品中にあるべきでないもので、 主として物理的な作用によ って健康上の危害を生じさせる可能性のあるものが 含まれる状態をいう。"}, {"label": "②", "text": "毛髪や昆虫等、ただちに 健康被害 に直結しない異物混入事例 であっても、 消費者が不快に 感じたり、製造工場 の衛生管理 に不信感をもつなどにより、 事業者の信用を失う事態になる。"}, {"label": "③", "text": "異物混入 の要因は、原料に由来するもの、 工場や敷地、設備 に由来するもの、 従業者自身 に よるものに 加えて、意図的に持ち込まれるものなどに 分けられる。"}, {"label": "④", "text": "食品への異物の混入は、フードチェーン 内における食品の不適切な取扱いによって 起こること から、異物混入対策 にはフードチェーン にかかわる 全員の協力が必要である。"}, {"label": "⑤", "text": "食品中の異物は、種類を問わず排除されるべきであり、 事業者は異物混入 のあった食品を回 収することが 法律で義務付けられている。"}], "answer": "5", "type": "single", "explanation": "正解（誤っているもの）は ⑤「食品中の異物は、種類を問わず排除されるべきであり、 事業者は異物混入 のあった食品を回 収することが 法律で義務付けられている。」。 ポイント：用語の定義と、制度/基準の位置づけを押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 41, "title": "食品への異物混入 の防止対策", "stem": "食品への異物混入 の防止対策 に関する次の記述について、 食品への異物混入防止 対策として、適切でないものを１つ 選べ。", "options": [{"label": "①", "text": "食品への混入異物 となる昆虫類は多種多様 であり、まずは 施設内にどのような 昆虫が生息し ているかを 調べて、昆虫の特性にあった防除方法 を選択する。"}, {"label": "②", "text": "鉱物性異物 には金属、ガラス、石などがある。 異物になりやすい ホチキス、クリップ、カッター などは使用しても差し支えないが、 調理場内 では決められた場所に保管する。"}, {"label": "③", "text": "頭髪の落下や食品への混入を防止するためには、 作業時の着衣や帽子・ネットの着用ととも に、毎日の洗髪などにより 自然に抜け落ちる毛髪の対策も行う。"}, {"label": "④", "text": "合成樹脂類 の異物には包装資材 やプラスッチック 製調理器具 の破損部分 などがある。 包装 資材が食品に混入しにくい取扱い方法の確認や調理器具類 の日々の点検を行う。"}, {"label": "⑤", "text": "食材由来 の異物として、卵の殻、軟骨、骨片、羽毛、硬 くなった植物組織 などがあり、ふるい による除去、目視 による検知・除去 などの対策を行う。"}], "answer": "2", "type": "single", "explanation": "正解（適切なもの）は ②「鉱物性異物 には金属、ガラス、石などがある。 異物になりやすい ホチキス、クリップ、カッター などは使用しても差し支えないが、 調理場内 では決められた場所に保管する。」。 ポイント：用語の定義と、制度/基準の位置づけを押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 42, "title": "異物混入 事故の事例問題", "stem": "次のような食品への異物混入事故 が発生した。事故の概要と異物の特性から、本事件 の予防対策 として、適切でないものを 選択肢から１つ選べ。  【概要】  お中元として届いたフルーツゼリー の詰め合わせ（半透明の合成樹脂製容器詰、 12個入 り）について、そのうち 一つを開けたところ、 小さな虫がゼリー内部に混入しているのを 見つ けたとの苦情があった。  調べてみたところ、 昆虫はユスリカの一種で、成虫であった。 カタラーゼ 試験の結果から加 熱されていることが 確認でき、さらに ゼリー内部にあったことから、 製造段階 での混入が疑 われた。  この工場では、5月以降、当該品 も含めた夏季商品 の製造に合わせて24時間体制 で稼 働していたが、 工場施設内部 を調査した結果では、ユスリカの発生は見られなかった。 【異物の特性】  ユスリカ類は、湖、川、下水溝 に発生し、成虫発生 のピークは初夏から秋。  強い正の走光性があり、夕方から夜間は灯火に飛来する。", "options": [{"label": "①", "text": "工場の外部に光が漏れている箇所を確認するなど、 外部からの飛来昆虫 の侵入対策 を講じ る。"}, {"label": "②", "text": "工場内で唯一の開放系となる充填機周囲 に防虫カーテンを設置し、昆虫の侵入を防ぐ。"}, {"label": "③", "text": "充填後の製品について、 目視による検品体制 を強化する。"}, {"label": "④", "text": "工場内での害虫駆除 を徹底し、薬剤散布 の頻度を高める。"}, {"label": "⑤", "text": "社内でこの情報を共有し、工場内でのユスリカの目撃情報 などを収集する。"}], "answer": "5", "type": "single", "explanation": "正解（適切なもの）は ⑤「社内でこの情報を共有し、工場内でのユスリカの目撃情報 などを収集する。」。 ポイント：用語の定義と、制度/基準の位置づけを押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 43, "title": "食品中の放射性物質 の規制", "stem": "食品中の放射性物質 の規制に関する次の記述のうち、誤っているものを１つ 選べ。", "options": [{"label": "①", "text": "日本では、食品中の放射性セシウムの基準値を食品群ごとに設定しており、 飲料水、牛乳 お よび乳児用食品 は10Bq/kg、一般食品 は100Bq/kg となっている。"}, {"label": "②", "text": "コーデックス 委員会の食品中の放射性セシウムの基準値は乳児用食品、一般食品 とも 1000 Bq/kgである。"}, {"label": "③", "text": "加工食品 は、原材料だけでなく、 製造・加工 された状態でも一般食品 の基準値を満たさなけ ればならな い。"}, {"label": "④", "text": "一般食品 は、飲料水、牛乳 および乳児用食品 に含まれないものすべてが 対象となる。"}, {"label": "⑤", "text": "お茶（緑茶） は飲む状態で飲料水の基準が適用されるが、 紅茶、ウーロン茶、レギュラーコー ヒー等は飲む状態で一般食品 の基準値が適用される。"}], "answer": "1", "type": "single", "explanation": "正解（誤っているもの）は ①「日本では、食品中の放射性セシウムの基準値を食品群ごとに設定しており、 飲料水、牛乳 お よび乳児用食品 は10Bq/kg、一般食品 は100Bq/kg となっている。」。 ポイント：放射の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 44, "title": "BSE （牛海綿状脳症 ）、鳥インフルエンザ", "stem": "BSE、鳥インフルエンザ に関する次の記述のうち、誤っているものを１つ 選べ。", "options": [{"label": "①", "text": "BSEは異常プリオンタンパク 質が神経組織 に蓄積することで、 異常行動、運動失調 などの症 状が発生し、死に至る牛の伝染病である。"}, {"label": "②", "text": "BSE対策として、国内では、肉骨粉の牛用飼料 への利用禁止、特定危険部位 の除去、牛トレ ーサビリティ 法による個体識別情報 の提供促進 などが行われている。"}, {"label": "③", "text": "国内 BSE 対策、輸入牛肉対策 が奏功して、国内の BSE リスクは無視できる状況が確保され ている。"}, {"label": "④", "text": "高病原性鳥 インフルエンザ が発生した場合は、当該農場 の家禽や卵の殺処分が行われてお り、市場に出回ることはない。"}, {"label": "⑤", "text": "国内においても 家禽の肉や卵を食べて鳥インフルエンザ に感染した事例が発生しており、 注 意が必要とされている。"}], "answer": "5", "type": "single", "explanation": "正解（誤っているもの）は ⑤「国内においても 家禽の肉や卵を食べて鳥インフルエンザ に感染した事例が発生しており、 注 意が必要とされている。」。 ポイント：BSEの定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 45, "title": "食品添加物 の分類", "stem": "食品添加物 に関する次の記述のうち、正しいものを１つ 選べ。", "options": [{"label": "①", "text": "指定添加物 は食品衛生法 に基づき所管大臣により指定されているもので、 化学的合成品 を 対象としている。"}, {"label": "②", "text": "食品添加物 は、合成、天然 の区別なく同等として位置付けている。"}, {"label": "③", "text": "食品添加物 は指定添加物、既存添加物、天然香料 の3種類に分類されている。"}, {"label": "④", "text": "既存添加物 は従来、天然添加物 と言われていたもので、 使用基準 や成分規格等 の規制はな い。"}, {"label": "⑤", "text": "一般に食品として飲食に供されているものは、 天然香料を除いて、添加物には分類しない。"}], "answer": "2", "type": "single", "explanation": "正解（正しいもの）は ②「食品添加物 は、合成、天然 の区別なく同等として位置付けている。」。 ポイント：添加物の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 46, "title": "食品添加物 の規制", "stem": "食品添加物 の規制に関する次の記述のうち、誤っているものを１つ 選べ。", "options": [{"label": "①", "text": "日本で使用できる多くの食品添加物 には成分規格 が定められており、その 成分規格 に合致 しない食品添加物 は販売できない。"}, 、 日本や欧米諸国 では使用が禁止されている。"}, {"label": "④", "text": "誘引剤は、昆虫の性フェロモン を製剤化したもので、 殺虫効果 はないが、 目的とする害虫の 行動を錯乱し、交尾や産卵などを妨害する。"}, {"label": "⑤", "text": "収穫後の農作物の貯蔵や輸送の際に防かび剤や殺菌剤として使用される物質をポストハー ベスト農薬といい、わが 国では農薬としての使用が禁止されている。"}], "answer": "2", "type": "single", "explanation": "正解（誤っているもの）は ②「エチレン、 次亜塩素酸水、重曹、食酢、天敵 など安全性が明らかなものでも、 農薬として登録 しなければならない。」。 ポイント：農薬の定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}, {"id": 50, "title": "バイオテクノロジー 応用食品", "stem": "遺伝子組換 え食品等に関する次の記述のうち、誤っているものを１つ 選べ。", "options": [{"label": "①", "text": "遺伝子組換 え食品とは、他の生物由来 の遺伝子を人為的に組み込んだ作物等から作られた 食品のことである。"}, {"label": "②", "text": "ゲノム編集技術応用食品 は、厚生労働省 への事前相談・届出 を経て、安全性に関する情報 が公開され、流通開始 となる。"}, {"label": "③", "text": "遺伝子組換 え食品の安全性評価 は、遺伝子を導入する前の食品と同程度のリスクであれば 容認できるという 実質的同等性 と呼ばれる概念に従って行われている。"}, {"label": "④", "text": "わが国で遺伝子組換 え農作物として認められているのは、 大豆、じゃがいも、とうもろこし、わ たの4作物である。"}, {"label": "⑤", "text": "食品表示法 において、 遺伝子組換 え作物と非遺伝子組換 え作物が分別されていない 原材料 の場合、「遺伝子組換 え不分別」の表示が義務づけられている。"}], "answer": "4", "type": "single", "explanation": "正解（誤っているもの）は ④「わが国で遺伝子組換 え農作物として認められているのは、 大豆、じゃがいも、とうもろこし、わ たの4作物である。」。 ポイント：ノロの定義・制度・予防原則を押さえる。（※学習補助の要約／公式解説ではありません）"}];
const STORAGE_KEY = "food_safety_kentei_lv2_mock_v3";

let state = {
  started: false,
  startTs: null,
  durationSec: 90*60,
  order: ORIGINAL_QUESTIONS.map((q,i)=>i),
  idx: 0,
  answers: {},
  flagged: {},
  submitted: false,
  score: null,
  wrongIds: [],
  viewMode: "all", // all | wrong | unanswered
  instantMode: false
};

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function load() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return;
  try { state = Object.assign(state, JSON.parse(raw)); } catch(e) {}
}

function resetAll() {
  if(!confirm("進捗・回答・採点結果をリセットします。よろしいですか？")) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = String(Math.floor(sec/60)).padStart(2,'0');
  const s = String(sec%60).padStart(2,'0');
  return `${m}:${s}`;
}
function getNow() { return Date.now(); }

function numToCircled(n) {
  const map = {'1':'①','2':'②','3':'③','4':'④','5':'⑤','6':'⑥','7':'⑦','8':'⑧','9':'⑨','10':'⑩'};
  return map[String(n).trim()] || String(n);
}

function flaggedCount() { return Object.keys(state.flagged).length; }

function isAnswered(q) {
  const a = state.answers[q.id];
  return (q.type==="single" && a?.choice) || (q.type==="multi" && a?.choice?.A && a?.choice?.B);
}

function isCorrect(id) {
  const q = ORIGINAL_QUESTIONS.find(x=>x.id===id);
  const a = state.answers[id];
  if(!a) return false;
  if(q.type==="single") {
    const correctLabel = numToCircled(q.answer);
    return a.choice === correctLabel;
  } else {
    const m = q.answer.match(/A=(\d+),?B=(\d+)/);
    if(!m) return false;
    return String(a.choice?.A||"")===m[1] && String(a.choice?.B||"")===m[2];
  }
}

function answeredCountStrict() {
  let answered=0;
  for(const q of ORIGINAL_QUESTIONS) if(isAnswered(q)) answered++;
  return answered;
}

function filteredOrder() {
  if(state.viewMode==="all") return state.order;
  const arr = [];
  for(const idx of state.order) {
    const q = ORIGINAL_QUESTIONS[idx];
    const hasAns = isAnswered(q);
    if(state.viewMode==="unanswered" && !hasAns) arr.push(idx);
    if(state.viewMode==="wrong" && state.submitted && hasAns && !isCorrect(q.id)) arr.push(idx);
  }
  return arr;
}

function currentQuestion() {
  const ord = filteredOrder();
  if(ord.length===0) return null;
  const safeIdx = Math.min(state.idx, ord.length-1);
  state.idx = safeIdx;
  return ORIGINAL_QUESTIONS[ord[safeIdx]];
}

function setTimerUI() {
  const el = document.getElementById("timeLeft");
  if(!state.started) { el.textContent = "90:00"; return; }
  const elapsed = (getNow() - state.startTs)/1000;
  const left = state.durationSec - elapsed;
  el.textContent = fmtTime(left);
  if(left <= 0 && !state.submitted) submitExam(true);
}

function buildList() {
  const list = document.getElementById("qList");
  list.innerHTML = "";
  state.order.forEach((origIdx) => {
    const q = ORIGINAL_QUESTIONS[origIdx];
    const btn = document.createElement("button");
    btn.className = "qbtn";
    btn.onclick = () => {
      const ord = filteredOrder();
      const pos = ord.indexOf(origIdx);
      state.idx = (pos>=0) ? pos : 0;
      save(); render();
    };
    btn.innerHTML = `
      <span><b>${q.id}</b> <span class="tag">${q.title}</span></span>
      <span class="tag">
        ${state.flagged[q.id] ? "🔖" : ""}
        ${isAnswered(q) ? "✅" : ""}
        ${state.submitted ? (isCorrect(q.id) ? "🟢" : "🔴") : ""}
      </span>
    `;
    list.appendChild(btn);
  });
}

function showResult(q) {
  const box = document.getElementById("resultBox");
  const saved = state.answers[q.id];

  // show if submitted OR instant mode with answered
  const shouldShow = state.submitted || (state.instantMode && isAnswered(q));
  box.style.display = shouldShow ? "block" : "none";
  if(!shouldShow) return;

  const judge = document.getElementById("judge");
  const correctAns = document.getElementById("correctAns");
  const yourAns = document.getElementById("yourAns");
  const exp = document.getElementById("explanation");

  if(q.type==="single") {
    correctAns.textContent = numToCircled(q.answer);
    yourAns.textContent = saved?.choice || "未回答";
  } else {
    correctAns.textContent = q.answer;
    const a = saved?.choice;
    yourAns.textContent = (a?.A && a?.B) ? `A=${a.A},B=${a.B}` : "未回答";
  }

  const ok = isCorrect(q.id);
  judge.textContent = ok ? "正解" : (isAnswered(q) ? "不正解" : "未回答");
  judge.className = ok ? "good" : (isAnswered(q) ? "bad" : "warn");
  exp.textContent = q.explanation || "（解説未設定）";
}

function renderQuestion() {
  const q = currentQuestion();
  const ord = filteredOrder();
  document.getElementById("totalCount").textContent = String(ord.length || 0);

  if(!q) {
    document.getElementById("qid").textContent = "—";
    document.getElementById("qtitle").textContent = "この表示モードに該当する問題がありません。";
    document.getElementById("stem").textContent = "";
    document.getElementById("opts").innerHTML = "";
    document.getElementById("resultBox").style.display = "none";
    return;
  }

  document.getElementById("qid").textContent = `ID${q.id}`;
  document.getElementById("qtitle").textContent = q.title;
  document.getElementById("stem").textContent = q.stem;

  document.getElementById("index").textContent = String(state.idx+1);
  document.getElementById("progress").textContent = `${answeredCountStrict()}/50`;

  const opts = document.getElementById("opts");
  opts.innerHTML = "";

  document.getElementById("multiNote").style.display = (q.type==="multi") ? "block" : "none";

  const saved = state.answers[q.id];

  if(q.type==="single") {
    q.options.forEach((o) => {
      const lab = document.createElement("label");
      lab.className = "opt";
      const input = document.createElement("input");
      input.type = "radio";
      input.name = "opt";
      input.value = o.label;
      input.disabled = state.submitted; // keep exam integrity; instant mode works pre-submit
      if(saved?.choice === o.label) input.checked = true;
      input.onchange = () => {
        state.answers[q.id] = {type:"single", choice: input.value};
        save(); renderStats(); buildList(); showResult(q);
      };
      const labSpan = document.createElement("div"); labSpan.className="lab"; labSpan.textContent=o.label;
      const txtSpan = document.createElement("div"); txtSpan.className="txt"; txtSpan.textContent=o.text;
      lab.appendChild(input);
      lab.appendChild(labSpan);
      lab.appendChild(txtSpan);
      opts.appendChild(lab);
    });
  } else {
    const maxN = Math.max(6, q.options.length || 6);
    const row = document.createElement("div");
    row.className="nav";
    row.style.marginTop="0";

    const mkSelect = (key) => {
      const wrap = document.createElement("div");
      wrap.style.display="flex";
      wrap.style.gap="8px";
      wrap.style.alignItems="center";
      wrap.style.border="1px solid var(--line)";
      wrap.style.borderRadius="14px";
      wrap.style.padding="10px 12px";
      wrap.style.background="rgba(255,255,255,.02)";
      const sp = document.createElement("b");
      sp.textContent = key + ":";
      const sel = document.createElement("select");
      sel.disabled = state.submitted;
      const op0 = document.createElement("option");
      op0.value=""; op0.textContent="選択";
      sel.appendChild(op0);
      for(let i=1;i<=maxN;i++) {
        const op = document.createElement("option");
        op.value=String(i);
        op.textContent=String(i);
        sel.appendChild(op);
      }
      if(saved?.choice?.[key]) sel.value = String(saved.choice[key]);
      sel.onchange = () => {
        const cur = state.answers[q.id]?.choice || {};
        cur[key] = sel.value;
        state.answers[q.id] = {type:"multi", choice: cur};
        save(); renderStats(); buildList(); showResult(q);
      };
      wrap.appendChild(sp);
      wrap.appendChild(sel);
      return wrap;
    };

    row.appendChild(mkSelect("A"));
    row.appendChild(mkSelect("B"));
    opts.appendChild(row);

    const note = document.createElement("div");
    note.className="small";
    note.style.marginTop="10px";
    note.textContent = "参考：設問の選択肢（番号/組合せ）";
    opts.appendChild(note);

    q.options.forEach((o) => {
      const div = document.createElement("div");
      div.className="small";
      div.style.border="1px solid var(--line)";
      div.style.borderRadius="14px";
      div.style.padding="10px 12px";
      div.style.background="rgba(255,255,255,.02)";
      div.textContent = `${o.label} ${o.text}`;
      opts.appendChild(div);
    });
  }

  document.getElementById("prevBtn").disabled = (state.idx===0);
  document.getElementById("nextBtn").disabled = (state.idx===ord.length-1);

  const markBtn = document.getElementById("markBtn");
  markBtn.textContent = state.flagged[q.id] ? "見直し解除" : "見直しフラグ";

  showResult(q);
}

function renderStats() {
  const answered = answeredCountStrict();
  document.getElementById("answered").textContent = String(answered);
  document.getElementById("flagged").textContent = String(flaggedCount());

  if(state.submitted) {
    document.getElementById("score").textContent = String(state.score);
    document.getElementById("rate").textContent = `${Math.round((state.score/50)*100)}%`;
  } else {
    document.getElementById("score").textContent = "—";
    document.getElementById("rate").textContent = "—";
  }

  document.getElementById("submitBtn").disabled = !state.started || state.submitted;
  document.getElementById("reviewBtn").disabled = !state.submitted;

  document.getElementById("modeWrongBtn").disabled = !state.submitted;
  document.getElementById("modeUnansweredBtn").disabled = !state.started;

  const instantBtn = document.getElementById("instantBtn");
  instantBtn.textContent = state.instantMode ? "即答モード: ON" : "即答モード: OFF";
}

function render() {
  setTimerUI();
  buildList();
  renderStats();
  renderQuestion();
}

function startExam() {
  if(state.started) return;
  state.started = true;
  state.startTs = getNow();
  state.submitted = false;
  state.score = null;
  state.wrongIds = [];
  state.viewMode = "all";
  save();
  render();
}

function submitExam(auto=false) {
  if(state.submitted) return;
  state.submitted = true;

  let sc = 0;
  const wrong = [];
  for(const q of ORIGINAL_QUESTIONS) {
    const a = state.answers[q.id];
    let ok = false;
    if(q.type==="single") {
      const correct = numToCircled(q.answer);
      ok = !!a && a.choice === correct;
    } else {
      const m = q.answer.match(/A=(\d+),?B=(\d+)/);
      ok = !!m && !!a && a.choice?.A === m[1] && a.choice?.B === m[2];
    }
    if(ok) sc++; else if(isAnswered(q)) wrong.push(q.id);
  }
  state.score = sc;
  state.wrongIds = wrong;
  save();
  render();
  if(auto) alert("時間切れのため自動提出しました。");
}

function setMode(mode) {
  state.viewMode = mode;
  state.idx = 0;
  save(); render();
}

function toggleReviewMode() {
  if(!state.submitted) return;
  setMode("wrong");
  const ord = filteredOrder();
  if(ord.length===0) setMode("all");
}

function toggleInstant() {
  state.instantMode = !state.instantMode;
  save(); render();
}

function nextQ() {
  const ord = filteredOrder();
  if(ord.length===0) return;
  if(state.idx < ord.length-1) state.idx++;
  save(); render();
}
function prevQ() {
  const ord = filteredOrder();
  if(ord.length===0) return;
  if(state.idx > 0) state.idx--;
  save(); render();
}

function wireEvents() {
  document.getElementById("startBtn").onclick = startExam;
  document.getElementById("submitBtn").onclick = () => submitExam(false);
  document.getElementById("reviewBtn").onclick = toggleReviewMode;
  document.getElementById("instantBtn").onclick = toggleInstant;
  document.getElementById("resetBtn").onclick = resetAll;

  document.getElementById("prevBtn").onclick = prevQ;
  document.getElementById("nextBtn").onclick = nextQ;

  document.getElementById("markBtn").onclick = () => {
    const q = currentQuestion();
    if(!q) return;
    if(state.flagged[q.id]) delete state.flagged[q.id]; else state.flagged[q.id]=true;
    save(); render();
  };

  document.getElementById("modeAllBtn").onclick = () => setMode("all");
  document.getElementById("modeWrongBtn").onclick = () => setMode("wrong");
  document.getElementById("modeUnansweredBtn").onclick = () => setMode("unanswered");

  window.addEventListener("keydown", (e) => {
    if(e.key==="ArrowLeft") prevQ();
    if(e.key==="ArrowRight") nextQ();
    if(e.key.toLowerCase()==="f") document.getElementById("markBtn").click();
  });
}

load();
wireEvents();
render();
setInterval(setTimerUI, 250);
</script>
</body>
</html>
